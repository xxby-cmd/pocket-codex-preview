<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.github.com https://cuddly-giggle-5gww6qqxjv9wfr45-8787.app.github.dev; base-uri 'none'; form-action 'none'"><title>随行 · 启动入口</title><link rel="stylesheet" href="style.css"></head><body><main><span class="tag">随行 CODEX</span><h1>打开，接着聊。</h1><p>收藏当前网址。云端停止后，这个入口依然可用。</p><section><p id="state" role="status">等待授权</p><div class="buttons"><button id="start">启动并进入</button><button id="stop">停止云端</button><button id="open">进入对话</button><button id="repair" hidden>重启云端修复</button></div><label class="check"><input id="auto" type="checkbox">打开本页时自动启动并进入</label><p id="notice" role="status" aria-live="polite"></p></section><details id="settings"><summary>首次授权 / 设置</summary><p>首次需要 GitHub 访问令牌，直接发送到 GitHub，不会写入项目。请只授予本项目 Codespaces 读取和 Codespaces lifecycle admin 写入权限。</p><form id="auth"><label for="token">GitHub 访问令牌</label><input id="token" type="password" autocomplete="off" required><label class="check"><input id="remember" type="checkbox">保存到这台手机（仅限自己的设备）</label><small>保存后，持有已解锁手机的人可控制云端。可随时清除。</small><button>保存并验证</button></form><button id="forget">清除手机授权</button><p><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">创建 GitHub 授权令牌</a> · <a href="https://github.com/codespaces" target="_blank" rel="noopener noreferrer">GitHub 手动管理</a></p></details><p><small>启动会消耗 Codespaces 时长。电脑须开机并联网；此入口不会开启已关机的电脑。停止后仍保留云端文件。</small></p></main><script src="app.js" type="module"></script></body></html>
