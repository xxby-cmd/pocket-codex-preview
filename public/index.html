<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fb"><title>随行 · Codex</title><link rel="stylesheet" href="./style.css"></head><body>
<header><div class="brand"><span class="mark">随</span><div><strong>随行 Codex</strong><small>把电脑上的工作，带在身边</small></div></div><span id="status" role="status">尚未连接</span><button id="logout" hidden>断开</button></header>
<main><section id="login" class="welcome"><span class="eyebrow">你的电脑，随时接续</span><h1>离开桌面，<br>对话继续。</h1><p>选择已有对话，查看进度，让电脑继续完成任务。</p><form id="loginForm"><label for="token">手机访问密钥</label><input id="token" type="password" autocomplete="off" required placeholder="输入启动程序生成的密钥"><button class="primary">连接我的电脑</button></form><p class="hint">密钥仅保留在当前页面内存中。刷新后需要重新输入。</p></section>
<section id="workspace" hidden><aside id="sidebar"><div class="row"><h2>我的对话</h2><button id="new">新对话</button></div><form id="searchForm"><label class="sr" for="search">搜索对话</label><input id="search" type="search" placeholder="搜索对话标题"><button>搜索</button></form><div id="threads"></div><button id="more" hidden>加载更多</button></aside>
<article id="conversation"><div class="chatHeader"><button id="back">对话列表</button><div><h2 id="title">从左侧选择一条对话</h2><small id="activity">消息由你的电脑处理</small></div><button id="refresh">刷新</button></div><div id="messages"><div class="empty">工作不必从头开始<br><small>打开已有对话，接着上次的进度继续。</small></div></div><section id="approvals" aria-label="待处理请求"></section><form id="composer"><label class="sr" for="text">发送给电脑的消息</label><textarea id="text" rows="3" placeholder="告诉电脑接下来做什么……" required disabled></textarea><div class="row"><small>初版：文字对话 · 电脑需保持在线</small><div><button type="button" id="stop" disabled>停止</button><button class="primary" id="send" disabled>发送消息</button></div></div></form></article></section></main><div id="notice" role="status" aria-live="polite"></div><script src="./app.js" type="module"></script></body></html>
